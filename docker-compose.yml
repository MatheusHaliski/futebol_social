
# Football AI · Social — infraestrutura local híbrida e distribuída
# MySQL 8 (RDBMS) · Redis (sessões/cache/rate-limit) · Cassandra 4.1 (feeds/telemetria) · MinIO (S3 para mídias e exports LGPD)
services:
  mysql:
    image: mysql:8.0
    container_name: fas-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: football_ai_social
      MYSQL_USER: fas
      MYSQL_PASSWORD: fas
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fas-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  cassandra:
    image: cassandra:4.1
    container_name: fas-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: fas-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./infra/cassandra/init.cql:/docker-entrypoint-initdb.d/init.cql:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  # Cria o keyspace assim que o Cassandra responde (a imagem oficial não executa init.cql sozinha)
  cassandra-init:
    image: cassandra:4.1
    container_name: fas-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./infra/cassandra/init.cql:/init.cql:ro
    entrypoint: ["/bin/sh", "-c", "cqlsh cassandra -f /init.cql && echo 'keyspace pronto'"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: fas-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Cria os buckets de mídia e de exportações LGPD
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: fas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/fas-media &&
      mc mb -p local/fas-lgpd-exports &&
      mc ilm add --expiry-days 7 local/fas-lgpd-exports &&
      echo 'buckets prontos'"
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  cassandra-data:
  minio-data:
