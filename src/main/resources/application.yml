# Football AI · Social — configuração base (segredos SEMPRE por variável de ambiente)
spring:
  application:
    name: football-ai-social
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/football_ai_social?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci}
    username: ${DB_USER:fas}
    password: ${DB_PASSWORD:fas}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o esquema é do Flyway; Hibernate apenas valida
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}:${CASSANDRA_PORT:9042}
    local-datacenter: ${CASSANDRA_DC:dc1}
    keyspace-name: football_ai_social
    schema-action: none
    request:
      timeout: 5s
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    relaxed-query-chars: "[,]"      # attr[velocidade]=gt:80 sem URL-encoding
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-in-env-<PREENCHER_JWT_SECRET>}   # ≥ 64 bytes em produção
    access-ttl: 15m
    refresh-ttl: 7d
    issuer: football-ai-social
  rate-limit:
    ip-per-minute: 120
    user-per-minute: 300
    login-per-minute: 10
    max-login-failures: 5
  crypto:
    key: ${APP_CRYPTO_KEY:}        # base64 de 32 bytes (AES-256-GCM) — vazio = chave de desenvolvimento
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}   # URL que o navegador alcança (pré-assinatura + CSP); vazio = endpoint
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    media-bucket: fas-media
    export-bucket: fas-lgpd-exports
    path-style: true
  lgpd:
    deletion-grace-days: 30
    export-ttl-days: 7
    consent-retention-years: 5
    anonymization-cron: "0 30 3 * * *"
  rarity:
    cron: "0 0 3 * * MON"
  terms:
    current-version: "2026.10"
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://localhost:5173
  cassandra:
    enabled: false
  seed:
    enabled: false                 # dados de exemplo (<PREENCHER_*>) — ligado nos perfis local e docker

logging:
  level:
    root: INFO
    com.footballai.social: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"   # sem PII nos logs

---
# Perfil LOCAL: só MySQL + Redis + MinIO (Cassandra desligado → feed via MySQL)
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraReactiveRepositoriesAutoConfiguration
app:
  cassandra:
    enabled: false
  seed:
    enabled: true

---
# Perfil DOCKER: stack completa do docker-compose (mysql, redis, cassandra, minio)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/football_ai_social?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
  data:
    redis:
      host: redis
  cassandra:
    contact-points: cassandra:9042
app:
  storage:
    endpoint: http://minio:9000
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
  cassandra:
    enabled: true
  seed:
    enabled: true
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://localhost:5173
